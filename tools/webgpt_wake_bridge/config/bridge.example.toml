# Copy to a LOCAL untracked file (preferably outside the consumer repository).
# Never commit the real target_conversation_url.

[project]
repo_root = "C:\\path\\to\\your_project"
remote = "origin"
branch = "main"
marker_root = "docs/web_bridge"

[review]
# REQUIRED for `once`/`daemon` and must match the configured github.com Git remote.
repository = "owner/repo"

[browser]
cdp_endpoint = "http://127.0.0.1:9222"
chrome_profile_path = "C:\\ChatGPT_Automation_Profile"
target_conversation_url = ""

[runtime]
poll_interval_s = 5
fetch_ack_timeout_s = 120
# Runtime/log/dedup/isolated-worktree state is local infrastructure, not project data.
# An external directory keeps the consumer repository clean.
runtime_dir = "C:\\WebGPT_Wake_Bridge_Runtime\\your_project"
max_log_bytes = 1048576
log_backups = 3
